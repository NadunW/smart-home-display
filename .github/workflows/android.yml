name: Build Android app

# Builds the wall-display APK. On main it is also published as the latest
# release, so the tablet can always download it from the same address:
# https://github.com/<user>/<repo>/releases/latest/download/family-display.apk
# Pull requests are built by ci.yml instead.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, to count changes for the patch number

      # Version is MAJOR.MINOR from android/VERSION plus PATCH = changes to the app (android/ or
      # this workflow) on main since android/VERSION last changed (a merged PR counts once).
      # Edit android/VERSION to bump; the patch restarts at 0. versionCode stays the run number,
      # so every APK still installs over the previous one.
      - name: Work out the version
        run: |
          BASE=$(git log -1 --format=%H -- android/VERSION)
          PATCH=$(git rev-list --count --first-parent "$BASE"..HEAD -- android .github/workflows/android.yml)
          VER="$(tr -d '[:space:]' < android/VERSION).$PATCH"
          echo "Version $VER (build $VERSION_CODE)"
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      # Optional: your own signing key from repository secrets (see README).
      - name: Use signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Surface compile errors as annotations so they show on the commit.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk family-display.apk

      - uses: actions/upload-artifact@v7
        with:
          name: family-display-${{ github.run_number }}
          path: family-display.apk

      - name: Publish as latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-$VERSION_NAME"
          # A manual re-run with no app changes has the same version: keep the release already out.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG is already released; nothing new to publish"
            exit 0
          fi
          gh release create "$TAG" family-display.apk \
            --target "$GITHUB_SHA" \
            --title "Family Display app $VERSION_NAME" \
            --notes "Install on the wall tablet: open https://github.com/${{ github.repository }}/releases/latest/download/family-display.apk on the tablet." \
            --latest
