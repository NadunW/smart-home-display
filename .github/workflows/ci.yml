name: CI

# Quality and build checks for every pull request. Branch protection on main
# requires the "All checks passed" job, so a PR can only be merged when it's green.
# Each check only runs when its part of the repo changed; the rest are skipped
# (a skipped check counts as passed).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Find what changed
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.f.outputs.web }}
      supabase: ${{ steps.f.outputs.supabase }}
      android: ${{ steps.f.outputs.android }}
      needs_changelog: ${{ steps.f.outputs.needs_changelog }}
      changelog: ${{ steps.f.outputs.changelog }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            files=$(git ls-files)   # check everything
          else
            files=$(git diff --name-only "$BASE"...HEAD)
          fi
          echo "Changed files:"; echo "$files"
          has() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          {
            echo "web=$(has '^(web/|tests/web/|\.github/scripts/check-web|\.github/workflows/ci\.yml)')"
            echo "supabase=$(has '^(supabase/|\.github/workflows/ci\.yml)')"
            echo "android=$(has '^(android/|\.github/workflows/(android|ci)\.yml)')"
            echo "changelog=$(has '^CHANGELOG\.md$')"
            # Pure docs changes (README, CLAUDE.md, other .md files) need no changelog line.
            echo "needs_changelog=$(echo "$files" | grep -vE '\.md$' | grep -q . && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  changelog:
    name: Changelog updated
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.needs_changelog == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check CHANGELOG.md has a line for this PR
        run: |
          if [ "${{ needs.changes.outputs.changelog }}" != true ]; then
            echo "::error file=CHANGELOG.md::This PR changes the app but not CHANGELOG.md. Add a line ending with (#${{ github.event.number }}) - see CLAUDE.md."
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Check the line mentions the PR number
        run: |
          if ! grep -q "(#${{ github.event.number }})" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no line ending with (#${{ github.event.number }})."
            exit 1
          fi

  web:
    name: Web app checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Syntax and structure checks
        run: node .github/scripts/check-web.mjs
      # Opens the page in a real browser against a fake Supabase and clicks through what the
      # family does (tests/web). A failure leaves a report with screenshots and traces.
      - name: Install the behaviour tests
        working-directory: tests/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Behaviour tests
        working-directory: tests/web
        run: npx playwright test
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-report
          path: tests/web/playwright-report/
          retention-days: 14

  function:
    name: Server function checks
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint
        run: deno lint --rules-exclude=no-explicit-any supabase/functions/
      - name: Type check
        run: deno check supabase/functions/*/index.ts

  migrations:
    name: Database migrations apply cleanly
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      # Starts a throwaway local Supabase database (with auth etc.) and runs every
      # migration in order, so a broken migration fails here instead of on the live project.
      - name: Apply all migrations to a local database
        run: |
          [ -f supabase/config.toml ] || supabase init --force --with-vscode-settings=false --with-intellij-settings=false
          supabase db start
          supabase migration list --local
      - name: Stop
        if: always()
        run: supabase stop --no-backup || true

  android:
    name: Android app builds
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
      - name: Build APK
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

  # The one check branch protection requires. Fails if any check above failed or was cancelled.
  all:
    name: All checks passed
    if: always()
    needs: [changes, changelog, web, function, migrations, android]
    runs-on: ubuntu-latest
    steps:
      - name: Result
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo '${{ toJSON(needs) }}' | jq -e 'map(.result) | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::Some checks failed"; exit 1
          fi
