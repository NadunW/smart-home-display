name: Deploy app to GitHub Pages

# Publishes the web/ folder whenever it changes on main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "VERSION"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # list and clear this run's own artifacts (see below)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, to count changes for the patch number

      - uses: actions/configure-pages@v6

      # Open displays check version.txt and reload themselves when it changes.
      - name: Stamp build version
        run: |
          printf '%s' "$GITHUB_SHA" > web/version.txt
          # Version is MAJOR.MINOR from the VERSION file, plus PATCH = changes to web/ on main
          # since VERSION last changed (a merged PR counts once). Edit VERSION to bump; patch restarts at 0.
          BASE=$(git log -1 --format=%H -- VERSION)
          PATCH=$(git rev-list --count --first-parent "$BASE"..HEAD -- web)
          VER="$(tr -d '[:space:]' < VERSION).$PATCH"
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Version $VER"
          sed -i "s/const BUILD='__BUILD__',VER='__VER__',BUILT='__BUILT__'/const BUILD='$GITHUB_SHA',VER='$VER',BUILT='$BUILT'/" web/index.html
          grep -q "const BUILD='$GITHUB_SHA'" web/index.html

      # A re-run keeps the artifact from the earlier attempt, and deploy-pages refuses to choose
      # between two. Remove it first so "Re-run" works.
      - name: Remove artifacts from earlier attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[].id'); do
            echo "Removing old artifact $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      # GitHub sometimes takes a few seconds to list a fresh artifact; deploy-pages looks only once.
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.total_count')
            if [ "$n" -ge 1 ]; then echo "Artifact listed after $((i * 2 - 2)) s"; exit 0; fi
            sleep 2
          done
          echo "::warning::The artifact still isn't listed after 60 s; trying to deploy anyway"

      - id: deployment
        uses: actions/deploy-pages@v5
