name: Deploy app to GitHub Pages

# Publishes the web/ folder whenever it changes on main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # Open displays check version.txt and reload themselves when it changes.
      - name: Stamp build version
        run: |
          printf '%s' "$GITHUB_SHA" > web/version.txt
          sed -i "s/const BUILD='__BUILD__'/const BUILD='$GITHUB_SHA'/" web/index.html
          grep -q "const BUILD='$GITHUB_SHA'" web/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v5
