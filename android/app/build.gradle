plugins {
    id 'com.android.application'
}

// CI passes the build number so every APK can update the previous one.
def buildNumber = (System.getenv('VERSION_CODE') ?: '1') as int
// CI passes MAJOR.MINOR.PATCH (see android.yml); local builds use MAJOR.MINOR from android/VERSION.
def appVersion = System.getenv('VERSION_NAME') ?: (rootProject.file('VERSION').text.trim() + '.0')

android {
    namespace 'se.familydisplay.app'
    compileSdk 35

    defaultConfig {
        applicationId 'se.familydisplay.app'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName appVersion
        // The page the app shows. Change here if the app moves.
        buildConfigField 'String', 'START_URL', '"https://nadunw.github.io/smart-home-display/"'
        buildConfigField 'String', 'APP_HOST', '"nadunw.github.io"'
    }

    buildFeatures {
        buildConfig true
    }

    // Signing: repository secrets win when present (see README); otherwise the
    // bundled key keeps every build installable as an update of the last one.
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'keystore/familydisplay.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'familydisplay'
            keyAlias System.getenv('KEY_ALIAS') ?: 'familydisplay'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'familydisplay'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
